version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: serp-postgres
    environment:
      POSTGRES_USER: serp
      POSTGRES_PASSWORD: serp_dev
      POSTGRES_DB: serp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serp']
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: serp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: serp
      MONGO_INITDB_ROOT_PASSWORD: serp_dev
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: serp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: serp
      RABBITMQ_DEFAULT_PASS: serp_dev
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
